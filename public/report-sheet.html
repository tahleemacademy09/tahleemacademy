<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كشف نتائج الطلبة - Tahleem Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f0f0f0;direction:rtl;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.toolbar{width:210mm;max-width:100%;display:flex;gap:10px;margin-bottom:16px;justify-content:flex-end;direction:ltr}
.toolbar button{padding:10px 24px;border-radius:6px;font-size:15px;font-family:'Cairo',sans-serif;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-print{background:#1a472a;color:#fff;border:none}
.btn-print:hover{opacity:.85}
.btn-clear{background:#fff;color:#333;border:2px solid #ccc}
.btn-clear:hover{background:#f5f5f5}
.page{width:210mm;max-width:100%;background:#fff;padding:28px 32px 24px;box-shadow:0 2px 16px rgba(0,0,0,.12);margin-bottom:20px}
.header{text-align:center;margin-bottom:18px}
.header .ar-title{font-family:'Amiri',serif;font-size:32px;font-weight:700;color:#1a472a;margin-bottom:2px}
.header .en-title{font-size:18px;font-weight:700;letter-spacing:4px;color:#1a472a;text-transform:uppercase}
.title-box{display:flex;justify-content:space-between;align-items:center;border:2px solid #2a7a2a;border-radius:6px;padding:8px 20px;margin-bottom:18px}
.title-box .en{font-size:16px;font-weight:700;color:#1a472a;direction:ltr}
.title-box .ar{font-family:'Amiri',serif;font-size:20px;font-weight:700;color:#1a472a}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 32px;margin-bottom:18px}
.info-field{display:flex;align-items:center;gap:8px}
.info-field label{font-weight:600;font-size:14px;white-space:nowrap;color:#333}
.info-field input{flex:1;border:none;border-bottom:1.5px solid #888;font-family:'Cairo',sans-serif;font-size:14px;padding:2px 4px;background:transparent;outline:none;text-align:center}
.info-field input:focus{border-bottom-color:#2a7a2a}
.section-title{font-family:'Amiri',serif;font-size:22px;font-weight:700;color:#1a472a;text-align:center;margin:16px 0 10px}
table{width:100%;border-collapse:collapse;direction:rtl;margin-bottom:16px}
th,td{border:1.5px solid #333;padding:6px 4px;text-align:center;font-size:13px}
th{background:#1a472a;color:#fff;font-weight:700}
th .sub{font-size:11px;font-weight:400;display:block;color:#cde6cd}
td input{width:100%;border:none;text-align:center;font-family:'Cairo',sans-serif;font-size:13px;background:transparent;outline:none;padding:2px}
td input:focus{background:#f0faf0}
.pass{color:#2a7a2a;font-weight:700}
.fail{color:#c0392b;font-weight:700}
.summary-table{width:100%;border-collapse:collapse;margin-top:10px}
.summary-table td{border:1.5px solid #333;padding:8px 10px;font-size:14px}
.summary-table td:nth-child(odd){background:#f5f5f0;font-weight:600;width:18%}
.summary-table td input{width:100%;border:none;background:transparent;font-family:'Cairo',sans-serif;font-size:14px;text-align:center;outline:none}
@media print{
  body{background:#fff;padding:0}
  .toolbar{display:none!important}
  .page{box-shadow:none;padding:20px 24px;width:100%}
  @page{size:A4;margin:0}
}
@media(max-width:800px){
  .page{padding:16px 10px}
  .info-grid{grid-template-columns:1fr}
  th,td{font-size:11px;padding:4px 2px}
}
</style>
</head>
<body>

<div class="toolbar">
<button class="btn-print" onclick="window.print()">🖨️ Print / Download PDF</button>
<button class="btn-clear" onclick="clearAll()">🗑️ Clear All</button>
</div>

<div class="page">
<div class="header">
<div class="ar-title">أكاديمية التعليم</div>
<div class="en-title">TAHLEEM ACADEMY</div>
</div>

<div class="title-box">
<span class="en">Student Report Sheet.</span>
<span class="ar">كشف نتائج الطلبة</span>
</div>

<div class="info-grid">
<div class="info-field"><label>اسم الطالب(ة):</label><input type="text" value="فاطمة أحمد / Fatimah Ahmed"></div>
<div class="info-field"><label>العام الدراسي:</label><input type="text" value="١٤٤٧ هـ / 2026 M"></div>
<div class="info-field"><label>المرحلة:</label><input type="text" value="المتوسطة / Intermediate"></div>
<div class="info-field"><label>عدد المواد:</label><input type="text" value="٧"></div>
<div class="info-field"><label>التاريخ:</label><input type="text" value="٠٦/٠٣/١٤٤٧"></div>
<div class="info-field"><label>الحالة:</label><input type="text" value="منتظمة / Regular"></div>
</div>

<div class="section-title">الفترة الأولى</div>

<table>
<thead>
<tr>
<th>المواد<span class="sub">Subject</span></th>
<th>التمرينات (٣٠)<span class="sub">Test</span></th>
<th>الإمتحانات (٧٠)<span class="sub">Exam</span></th>
<th>المجموع الكلي (١٠٠)<span class="sub">Total</span></th>
<th>%<span class="sub">%</span></th>
<th>GP<span class="sub">GP</span></th>
<th>النتيجة<span class="sub">Result</span></th>
</tr>
</thead>
<tbody id="tableBody">
</tbody>
</table>

<table class="summary-table">
<tr>
<td>Marks Obtainable</td><td><input type="text" id="sumObtainable" value="700"></td>
<td>Marks Obtained</td><td><input type="text" id="sumObtained" readonly></td>
</tr>
<tr>
<td>CGPA</td><td><input type="text" id="sumCgpa" readonly></td>
<td>Status</td><td><input type="text" id="sumStatus" readonly></td>
</tr>
<tr>
<td>Comment</td><td><input type="text" id="sumComment" value="طالبة مجتهدة / Hardworking student"></td>
<td>Signature</td><td><input type="text" id="sumSignature" value="Ustadha Maryam"></td>
</tr>
</table>
</div>

<script>
const initialData=[
["القرآن الكريم / Quran",28,65],
["التجويد / Tajweed",27,61],
["الإملاء / Dictation",25,58],
["اللغة العربية / Arabic Lang",26,62],
["الفقه / Islamic Fiqh",29,67],
["العقيدة / Aqeedah",30,70],
["السيرة / Seerah",24,55],
["","",""],
["","",""],
["","",""]
];
const tbody=document.getElementById("tableBody");
initialData.forEach((r,i)=>{
const tr=document.createElement("tr");
tr.innerHTML=`<td><input type="text" value="${r[0]}" class="subject"></td><td><input type="number" value="${r[1]}" class="test" min="0" max="30"></td><td><input type="number" value="${r[2]}" class="exam" min="0" max="70"></td><td><input type="text" class="total" readonly></td><td><input type="text" class="pct" readonly></td><td><input type="text" class="gp" readonly></td><td><input type="text" class="result" readonly></td>`;
tbody.appendChild(tr);
});

function calcGP(t){if(t>=90)return 4.0;if(t>=80)return 3.0;if(t>=70)return 2.0;if(t>=60)return 1.0;return 0.0}

function recalc(){
let totalSum=0,gpSum=0,count=0;
tbody.querySelectorAll("tr").forEach(tr=>{
const test=parseFloat(tr.querySelector(".test").value)||0;
const exam=parseFloat(tr.querySelector(".exam").value)||0;
const total=test+exam;
const hasData=tr.querySelector(".test").value!==""||tr.querySelector(".exam").value!=="";
tr.querySelector(".total").value=hasData?total:"";
tr.querySelector(".pct").value=hasData?total+"%":"";
const gp=calcGP(total);
tr.querySelector(".gp").value=hasData?gp.toFixed(1):"";
const resInput=tr.querySelector(".result");
if(hasData){
if(total>=50){resInput.value="Pass ✓";resInput.className="result pass"}
else{resInput.value="Fail ✗";resInput.className="result fail"}
totalSum+=total;gpSum+=gp;count++;
}else{resInput.value="";resInput.className="result"}
});
document.getElementById("sumObtained").value=count?totalSum:"";
document.getElementById("sumCgpa").value=count?(gpSum/count).toFixed(2):"";
document.getElementById("sumStatus").value=count?(totalSum/(count*100)*100>=50?"Pass ✓":"Fail ✗"):"";
}

tbody.addEventListener("input",recalc);
recalc();

function clearAll(){
if(!confirm("Are you sure you want to clear all fields?\nهل أنت متأكد من مسح جميع الحقول؟"))return;
document.querySelectorAll("input").forEach(i=>{if(!i.readOnly)i.value=""});
recalc();
}
</script>
</body>
</html>
