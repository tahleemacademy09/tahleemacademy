    <!--
      ╔══════════════════════════════════════════════════════════╗
      ║  INLINE SPLASH SCREEN — painted before ANY JS loads     ║
      ║                                                          ║
      ║  WHY THIS EXISTS:                                        ║
      ║  iOS and Android kill PWA WebView processes when the app ║
      ║  is backgrounded (memory pressure). On resume, a full   ║
      ║  page reload is unavoidable — the OS has terminated the  ║
      ║  process entirely. VS Code web, Tahleem, every PWA hits  ║
      ║  this. No JS fix can prevent it.                         ║
      ║                                                          ║
      ║  What we CAN do: make the reload feel instant by showing ║
      ║  a branded splash screen on the very first paint (before ║
      ║  React, before fonts, before anything). The user sees   ║
      ║  the academy logo immediately instead of a white flash.  ║
      ║  React then mounts underneath and fades the splash out.  ║
      ║                                                          ║
      ║  The splash is only shown when returning from background ║
      ║  (document.referrer === '' AND sessionStorage has a      ║
      ║  saved path) — i.e. a reload triggered by OS process     ║
      ║  kill. It is NOT shown on normal navigation.             ║
      ╚══════════════════════════════════════════════════════════╝
    -->
    <link rel="preload" as="image" href="/brand-logo.png" />
    <style>
      #ta-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(160deg, #0a1f14 0%, #0f2419 50%, #1a3a2a 100%);
        transition: opacity 0.35s ease;
      }
      #ta-splash.ta-fade {
        opacity: 0;
        pointer-events: none;
      }
      #ta-splash.ta-gone {
        display: none;
      }
      .ta-splash-logo {
        width: 200px;
        height: 200px;
        object-fit: contain;
        filter: drop-shadow(0 4px 24px rgba(201,168,76,0.25));
      }
      .ta-splash-icon {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
        border: 1.5px solid rgba(201,168,76,0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
      }
      .ta-splash-name {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 22px;
        font-weight: 700;
        color: rgba(201,168,76,0.95);
        letter-spacing: 0.5px;
        text-align: center;
      }
      .ta-splash-ar {
        font-size: 16px;
        color: rgba(201,168,76,0.6);
        direction: rtl;
        margin-top: -10px;
      }
      .ta-splash-bar {
        width: 48px;
        height: 3px;
        border-radius: 999px;
        background: rgba(201,168,76,0.2);
        overflow: hidden;
        margin-top: 8px;
      }
      .ta-splash-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(201,168,76,0.4), rgba(201,168,76,0.9));
        animation: ta-bar-anim 1.6s ease forwards;
      }

      /* ── Native app welcome (Capacitor only) — shown on cold start, before the home screen ── */
      #ta-welcome {
        position: fixed; inset: 0; z-index: 100000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top,0px) 28px env(safe-area-inset-bottom,0px);
        background: linear-gradient(160deg, #064E3B 0%, #0a3326 55%, #0a1f14 100%);
        color: #f3e6b8; text-align: center; overflow: hidden;
        transition: opacity 0.5s ease;
      }
      #ta-welcome.ta-fade { opacity: 0; pointer-events: none; }
      #ta-welcome.ta-gone { display: none; }
      #ta-welcome::before {
        content: ""; position: absolute; width: 140vmax; height: 140vmax; left: 50%; top: 50%;
        transform: translate(-50%,-50%);
        background: repeating-conic-gradient(from 0deg, rgba(201,168,76,0.045) 0 7.5deg, transparent 7.5deg 15deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%);
                mask-image: radial-gradient(circle, #000 0%, transparent 62%);
        animation: ta-w-spin 90s linear infinite;
      }
      .ta-w-item { position: relative; opacity: 0; transform: translateY(10px); animation: ta-w-in 0.8s ease forwards; }
      .ta-w-logo { width: 132px; height: 132px; object-fit: contain; filter: drop-shadow(0 6px 28px rgba(201,168,76,0.35)); animation-delay: 0.05s; }
      .ta-w-bism { font-family: 'Amiri','Noto Naskh Arabic','Traditional Arabic',serif; font-size: 27px; line-height: 1.7; color: #d9b95a; margin-top: 22px; animation-delay: 0.35s; }
      .ta-w-salam { font-family: 'Amiri','Noto Naskh Arabic','Traditional Arabic',serif; font-size: 23px; line-height: 1.7; color: #f3e6b8; margin-top: 6px; animation-delay: 0.75s; }
      .ta-w-hello { font-family: 'Georgia','Times New Roman',serif; font-size: 20px; font-weight: 700; color: #f3e6b8; margin-top: 18px; animation-delay: 1.1s; }
      .ta-w-sub { font-family: system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-size: 14px; line-height: 1.6; color: rgba(243,230,184,0.72); margin-top: 6px; max-width: 300px; animation-delay: 1.35s; }
      .ta-w-dua { position: absolute; left: 24px; right: 24px; bottom: calc(env(safe-area-inset-bottom,0px) + 46px); animation-delay: 1.7s; }
      .ta-w-dua b { display: block; font-family: 'Amiri','Noto Naskh Arabic','Traditional Arabic',serif; font-size: 20px; font-weight: 400; color: #d9b95a; }
      .ta-w-dua i { display: block; font-family: system-ui,sans-serif; font-size: 12px; font-style: normal; color: rgba(243,230,184,0.55); margin-top: 2px; }
      .ta-w-bar { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom,0px) + 22px); width: 48px; height: 3px; margin-left: -24px; border-radius: 999px; background: rgba(201,168,76,0.2); overflow: hidden; }
      .ta-w-bar::after { content: ""; display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, rgba(201,168,76,0.4), rgba(201,168,76,0.95)); animation: ta-bar-anim 2.6s ease forwards; }
      @keyframes ta-w-in { to { opacity: 1; transform: none; } }
      @keyframes ta-w-spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #ta-welcome::before { animation: none; } .ta-w-item { animation-duration: 0.01s; animation-delay: 0s; } }
      @keyframes ta-bar-anim {
        0%   { width: 0%; }
        60%  { width: 70%; }
        100% { width: 100%; }
      }
    </style>
    <script>
      // Show splash ONLY on a process-kill reload (not on first visit or navigation).
      // Signals: sessionStorage has a saved restore path (set by useAppStateRestore
      // before backgrounding) but document.referrer is empty (full reload, not navigation).
      (function() {
        try {
          if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) return;
          var hasSaved = !!sessionStorage.getItem('ta_restore_path');
          var isReload = !document.referrer || document.referrer === '';
          // Also show on first-ever load if it's the PWA (standalone mode)
          var isStandalone = window.matchMedia('(display-mode: standalone)').matches
                          || window.navigator.standalone === true;
          if ((hasSaved && isReload) || (isStandalone && isReload && !sessionStorage.getItem('ta_launched'))) {
            sessionStorage.setItem('ta_launched', '1');
            document.write('<div id="ta-splash"><img class="ta-splash-logo" src="/brand-logo.png" alt=""><div class="ta-splash-bar"><div class="ta-splash-bar-fill"></div></div></div>');
          }
        } catch(e) {}
      })();
    </script>

  <body>
    <script>
      // Native app only: warm welcome on a cold start, painted from this HTML (no React needed), so it is on screen
      // the moment the native splash goes away. Skipped when the OS killed the app mid-use and we are restoring the page.
      (function() {
        try {
          var C = window.Capacitor;
          if (!(C && C.isNativePlatform && C.isNativePlatform())) return;
          if (sessionStorage.getItem('ta_restore_path') || sessionStorage.getItem('ta_welcomed')) return;
          sessionStorage.setItem('ta_welcomed', '1');
          document.write(
            '<div id="ta-welcome" dir="ltr">' +
              '<img class="ta-w-item ta-w-logo" src="/brand-logo.png" alt="">' +
              '<div class="ta-w-item ta-w-bism" dir="rtl" lang="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>' +
              '<div class="ta-w-item ta-w-salam" dir="rtl" lang="ar">ٱلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ ٱللَّهِ وَبَرَكَاتُهُ</div>' +
              '<div class="ta-w-item ta-w-hello">Welcome to Tahleem Academy</div>' +
              '<div class="ta-w-item ta-w-sub">A place to learn the Qur’an and the Arabic language.</div>' +
              '<div class="ta-w-item ta-w-dua"><b dir="rtl" lang="ar">رَبِّ زِدْنِي عِلْمًا</b><i>“My Lord, increase me in knowledge.”</i></div>' +
              '<div class="ta-w-bar"></div>' +
            '</div>');
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <!-- Paystack: loaded once the browser is idle (off the critical path) so it
         never competes with the app's own code. Still present long before anyone
         reaches a payment screen; RegisterContinue also loads it itself if needed. -->
    <script>
      (function () {
        function load() {
          if (document.getElementById('paystack-script')) return;
          var s = document.createElement('script');
          s.id = 'paystack-script'; s.src = 'https://js.paystack.co/v1/inline.js'; s.async = true;
          document.body.appendChild(s);
        }
        window.addEventListener('load', function () {
          if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 3000 });
          else setTimeout(load, 1500);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Dismiss the splash once React has mounted.
      We listen for a custom "ta-app-ready" event dispatched by main.tsx,
      OR fall back to a 2.5s timeout.
    -->
    <script>
      (function() {
        var shownAt = Date.now(), MIN_MS = 2600, MAX_MS = 6000, ready = false, closed = false;
        function closeWelcome() {
          var el = document.getElementById('ta-welcome');
          if (!el || closed) return;
          closed = true;
          el.classList.add('ta-fade');
          setTimeout(function() { el.classList.add('ta-gone'); }, 560);
        }
        function maybeClose() {
          if (!ready) return;
          var wait = MIN_MS - (Date.now() - shownAt);
          if (wait <= 0) closeWelcome(); else setTimeout(closeWelcome, wait);
        }
        window.addEventListener('ta-app-ready', function() { ready = true; maybeClose(); }, { once: true });
        setTimeout(closeWelcome, MAX_MS);                      // never trap the user, even if the app fails to start
        var w = document.getElementById('ta-welcome');
        if (w) w.addEventListener('click', function() { if (Date.now() - shownAt > 800) closeWelcome(); });   // tap to skip
      })();
      (function() {
        function dismissSplash() {
          var el = document.getElementById('ta-splash');
          if (!el) return;
          el.classList.add('ta-fade');
          setTimeout(function() { el.classList.add('ta-gone'); }, 380);
        }
        window.addEventListener('ta-app-ready', dismissSplash, { once: true });
        // Fallback: always clear within 2.5s even if event never fires
        setTimeout(dismissSplash, 2500);
      })();
    </script>
