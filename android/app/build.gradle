apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def ksFile = rootProject.file("keystore.properties")
def ksProps = new Properties()
if (ksFile.exists()) { ksFile.withInputStream { ksProps.load(it) } }

// Automatic versioning: nobody edits these numbers by hand.
//  - versionCode = minutes since 1970 (always goes up, fits an Int until the year 5000+).
//  - versionName = build date, e.g. 2026.10.28
// CI / scripts can override with APP_VERSION_CODE / APP_VERSION_NAME.
def autoVersionCode = (System.getenv("APP_VERSION_CODE") ?: String.valueOf(System.currentTimeMillis().intdiv(60000L))).toInteger()
def autoVersionName = System.getenv("APP_VERSION_NAME") ?: new Date().format("yyyy.MM.dd", TimeZone.getTimeZone("UTC"))

android {
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "TahleemAcademy-${variant.name}.apk"
        }
    }

    namespace = "com.tahleemacademy.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tahleemacademy.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode autoVersionCode
        versionName autoVersionName
        // Ship native libs (LiveKit/WebRTC) for every common CPU type. Locking this to
        // arm64-v8a alone makes the APK uninstallable on 32-bit ARM phones (armeabi-v7a),
        // which many budget Android devices still run, and on x86_64 devices/emulators.
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Must match the Java 21 target Capacitor sets in capacitor.build.gradle
    kotlinOptions {
        jvmTarget = '21'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (ksFile.exists()) { signingConfig signingConfigs.release }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Screen sharing from the phone (ScreenSharePlugin.kt). If Gradle says this
    // version can't be found, use the newest 2.x from https://central.sonatype.com/artifact/io.livekit/livekit-android
    implementation 'io.livekit:livekit-android:2.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
